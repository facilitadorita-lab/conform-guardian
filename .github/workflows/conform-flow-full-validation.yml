name: Conform Flow full isolated validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "backend/supabase/**"
      - "scripts/**"
      - "tests/**"
      - "playwright.config.ts"
      - ".github/workflows/conform-flow-full-validation.yml"

permissions:
  contents: read

concurrency:
  group: conform-flow-full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # These values are intentionally fixed to the disposable local runner.
      SUPABASE_ENVIRONMENT: local
      NODE_ENV: test
      E2E_ENVIRONMENT: "true"
      CONFORM_TEST_ENV: local
      CONFORM_ALLOW_REMOTE_TESTS: "0"
      STRIPE_MODE: test
      VITE_USE_MOCKS: "false"
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_URL: http://127.0.0.1:54321
      E2E_BASE_URL: http://127.0.0.1:4173
      APP_URL: http://127.0.0.1:4173
      ALLOWED_ORIGIN: http://127.0.0.1:4173
      MAIL_CAPTURE_URL: http://127.0.0.1:54324

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright test runner
        run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.52.0

      - name: Install desktop and mobile browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: TypeScript preflight
        run: pnpm exec tsc --noEmit

      - name: Lint changed TypeScript without rewriting files
        shell: bash
        run: |
          set -euo pipefail
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          mapfile -t lint_files < <(
            git diff --name-only --diff-filter=ACMR "$base_ref...HEAD" -- '*.ts' '*.tsx'
          )
          if [ "${#lint_files[@]}" -gt 0 ]; then
            pnpm exec eslint --no-fix --rule 'prettier/prettier: off' "${lint_files[@]}"
          fi

      - name: Fail-closed environment preflight
        run: node scripts/validate-environment.mjs

      - name: Start disposable Supabase
        run: supabase start --workdir backend -x studio,imgproxy,logflare,vector,supavisor --debug

      - name: Rehearse migration from the legacy schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation/rls
          supabase db reset --workdir backend --version 20260730000500
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f backend/supabase/tests/multiunit_legacy_fixture.sql \
            | tee artifacts/validation/rls/multiunit-legacy-fixture.log
          supabase migration up --workdir backend --local
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f backend/supabase/tests/multiunit_migration_rehearsal.sql \
            | tee artifacts/validation/rls/multiunit-migration-rehearsal.log

      - name: Reset database from an empty state
        run: supabase db reset --workdir backend

      - name: Validate private evidence bucket
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation/rls
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "select id, public, file_size_limit from storage.buckets where id = 'evidencias' and public = false;" \
            | tee artifacts/validation/rls/storage-bucket.log
          bucket_count=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -At \
            -c "select count(*) from storage.buckets where id = 'evidencias' and public = false;")
          test "$bucket_count" = "1"

      - name: Export local Supabase runtime values
        shell: bash
        run: |
          set -euo pipefail
          supabase status --workdir backend -o env > "$RUNNER_TEMP/supabase.env"
          # status -o env uses API_URL/ANON_KEY/SERVICE_ROLE_KEY; only local
          # values are copied to GITHUB_ENV and never uploaded as artifacts.
          source "$RUNNER_TEMP/supabase.env"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Generate disposable E2E password
        shell: bash
        run: echo "E2E_TEST_PASSWORD=ConformFlow-E2E-${GITHUB_RUN_ID}-$(openssl rand -hex 12)!" >> "$GITHUB_ENV"

      - name: Re-check environment after local binding
        run: node scripts/validate-environment.mjs

      - name: Run SQL isolation and security suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation/rls
          for test_file in \
            backend/supabase/tests/tenant_isolation.sql \
            backend/supabase/tests/security_controls.sql \
            backend/supabase/tests/sandbox_owner_isolation.sql \
            backend/supabase/tests/production_readiness.sql \
            backend/supabase/tests/partner_isolation.sql \
            backend/supabase/tests/multiunit_isolation.sql \
            backend/supabase/tests/addon_limits.sql; do
            echo "Running $test_file"
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f "$test_file" | tee "artifacts/validation/rls/$(basename "$test_file").log"
          done

      - name: Validate database contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation/stripe
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f backend/supabase/tests/stripe_contracts.sql \
            | tee artifacts/validation/stripe/contracts.log

      - name: Lint database
        run: supabase db lint --workdir backend --local --level warning

      - name: Bootstrap isolated accounts and operational fixtures
        run: node scripts/bootstrap-validation.mjs

      - name: Validate concurrent unit capacity
        run: node scripts/test-multiunit-concurrency.mjs

      - name: Generate upload fixtures
        run: node scripts/create-test-files.mjs

      - name: Prepare evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation/{playwright,screenshots,traces,videos,emails,uploads,stripe,rls,performance}

      - name: Prepare local Edge Function environment
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/functions.env" <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          ALLOWED_ORIGIN=http://127.0.0.1:4173
          ALLOWED_ORIGINS=http://127.0.0.1:4173
          APP_URL=http://127.0.0.1:4173
          MAIL_CAPTURE_URL=http://127.0.0.1:54324
          INVITE_REDIRECT_URL=http://127.0.0.1:4173/definir-senha
          STRIPE_MODE=test
          AI_PROVIDER=structured
          SYSTEM_CRON_SECRET=test-only-local-cron-secret
          EOF

      - name: Start local Edge Functions
        shell: bash
        run: |
          supabase functions serve --workdir backend --env-file "$RUNNER_TEMP/functions.env" \
            > "$RUNNER_TEMP/functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/functions.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --request POST \
              --header "Authorization: Bearer test-only-local-cron-secret" \
              http://127.0.0.1:54321/functions/v1/system-health-check > artifacts/validation/functions-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/functions.log"
          exit 1

      - name: Build production frontend
        run: pnpm build

      - name: Start frontend for Playwright
        shell: bash
        run: |
          pnpm dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Run Playwright desktop and mobile suites
        run: pnpm exec playwright test

      - name: Run controlled local load
        if: success()
        run: node scripts/run-controlled-load.mjs

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conform-flow-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/validation/**
            ${{ runner.temp }}/frontend.log
            ${{ runner.temp }}/functions.log
          # Do not upload .env files, local keys, tokens or passwords.

      - name: Clean disposable validation artifacts
        if: always()
        run: node scripts/cleanup-validation.mjs

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/frontend.pid" ]; then kill "$(cat "$RUNNER_TEMP/frontend.pid")" || true; fi
          if [ -f "$RUNNER_TEMP/functions.pid" ]; then kill "$(cat "$RUNNER_TEMP/functions.pid")" || true; fi
          supabase stop --workdir backend --no-backup
