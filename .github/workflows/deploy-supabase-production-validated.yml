name: Deploy Supabase production (validated)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DEPLOY para publicar a migration já validada"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conform-flow-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate protected configuration
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD" && test -n "$PROJECT_ID"
      - name: Link project
        run: supabase link --workdir backend --project-ref "$PROJECT_ID"
      - name: Preview migrations
        run: supabase db push --workdir backend --linked --dry-run --include-all
      - name: Apply migrations
        run: supabase db push --workdir backend --linked --include-all
      - name: Deploy Edge Functions
        run: supabase functions deploy --workdir backend --project-ref "$PROJECT_ID"
      - name: Synchronize Stripe live catalog
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          curl --fail-with-body --request POST "$SUPABASE_URL/functions/v1/sync-stripe-catalog" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"confirmation":"SINCRONIZAR-CATALOGO","expected_mode":"live"}'
      - name: Register successful production release
        if: ${{ success() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          curl --fail-with-body --request POST "$SUPABASE_URL/rest/v1/implantacoes_sistema" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"ambiente\":\"production\",\"versao\":\"github-${GITHUB_RUN_NUMBER}\",\"commit_sha\":\"${GITHUB_SHA}\",\"status\":\"succeeded\",\"concluido_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
