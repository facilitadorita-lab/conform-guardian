name: Deploy Supabase staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite HOMOLOGAR para confirmar a implantação no ambiente de homologação
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conform-flow-supabase-staging
  cancel-in-progress: false

jobs:
  frontend-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  tenant-security-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start --workdir backend -x studio,imgproxy,inbucket,logflare,vector,supavisor
      - run: supabase db reset --workdir backend
      - env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/supabase/tests/tenant_isolation.sql
      - env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/supabase/tests/security_controls.sql
      - env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/supabase/tests/sandbox_owner_isolation.sql
      - env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/supabase/tests/production_readiness.sql
      - if: always()
        run: supabase stop --workdir backend --no-backup

  validate-and-deploy:
    needs: [frontend-preflight, tenant-security-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      CONFIRM_STAGING_DEPLOY: ${{ inputs.confirmation }}
      CONFORM_TEST_ENV: staging
      SUPABASE_ENVIRONMENT: staging
      CONFORM_ALLOW_REMOTE_TESTS: '1'
      STRIPE_MODE: test
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Block unsafe or production targets
        run: node scripts/validate-staging-target.mjs
      - name: Link homologation project
        run: supabase link --workdir backend --project-ref "$PROJECT_ID"
      - name: Preview migrations
        run: supabase db push --workdir backend --linked --dry-run --include-all
      - name: Lint linked database before deployment
        run: supabase db lint --workdir backend --linked --fail-on error
      - name: Apply migrations
        run: supabase db push --workdir backend --linked --include-all
      - name: Confirm migration convergence
        run: supabase db push --workdir backend --linked --dry-run --include-all
      - name: Lint linked database after deployment
        run: supabase db lint --workdir backend --linked --fail-on error
      - name: Deploy Edge Functions
        run: supabase functions deploy --workdir backend --project-ref "$PROJECT_ID"
      - name: Validate published REST contracts
        run: node scripts/verify-staging-contracts.mjs
      - name: Register successful staging release
        run: |
          curl --fail-with-body --request POST "$SUPABASE_URL/rest/v1/implantacoes_sistema" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"ambiente\":\"staging\",\"versao\":\"github-${GITHUB_RUN_NUMBER}\",\"commit_sha\":\"${GITHUB_SHA}\",\"status\":\"succeeded\",\"concluido_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"metadata_json\":{\"workflow_run_id\":\"${GITHUB_RUN_ID}\",\"validated_contracts\":true}}"
      - name: Write deployment summary
        if: success()
        run: |
          echo "## Homologação implantada com segurança" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations convergentes: sim" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contratos REST essenciais: aprovados" >> "$GITHUB_STEP_SUMMARY"
          echo "- Projeto de produção: bloqueado pelo preflight" >> "$GITHUB_STEP_SUMMARY"
