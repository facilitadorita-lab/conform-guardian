name: Process billing delinquency

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conform-flow-process-dunning
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SYSTEM_CRON_SECRET: ${{ secrets.SYSTEM_CRON_SECRET }}
    steps:
      - name: Verify protected scheduler configuration
        id: config
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SYSTEM_CRON_SECRET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Protected scheduler not configured; no public fallback was used."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Process subscriptions in delinquency
        if: steps.config.outputs.enabled == 'true'
        run: |
          curl --fail-with-body --request POST "$SUPABASE_URL/functions/v1/process-dunning" \
            --header "Authorization: Bearer $SYSTEM_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'
